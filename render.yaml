services:
  - type: web
    name: kklijp
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: KKLIJP_ADMIN_PASSWORD
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
