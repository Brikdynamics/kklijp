<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KKLIJP</title>
  <style>:root{--bg:#070713;--panel:#101025;--card:#12122c;--line:rgba(136,115,255,.22);--text:#f7f7ff;--muted:#a8a5c7;--pink:#ff2ccf;--blue:#31c9ff;--red:#ff314e;--grad:linear-gradient(135deg,var(--pink),var(--blue));font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1d1247 0,#070713 35%,#05050d 100%);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;position:relative;overflow-x:hidden}.orb{position:fixed;filter:blur(90px);opacity:.28;pointer-events:none}.orb.a{width:380px;height:380px;background:#7b2cff;top:-80px;left:-80px}.orb.b{width:420px;height:420px;background:#00b3ff;bottom:0;right:-120px}.gridBg{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(#000,transparent 75%);pointer-events:none}.container{width:min(1500px,calc(100% - 32px));margin:0 auto}.top{position:sticky;top:0;z-index:20;background:rgba(7,7,19,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topInner{width:min(1500px,calc(100% - 32px));margin:auto;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:14px;align-items:center;padding:17px 0}.brand{background:transparent;border:0;color:inherit;padding:0}.logo{display:inline-flex;flex-direction:column;line-height:.9;align-items:center;gap:4px}.dead{color:var(--pink);font-weight:900;letter-spacing:10px;text-shadow:0 0 20px var(--pink);font-size:24px}.word{font-weight:1000;font-style:italic;font-size:36px;letter-spacing:-1px}.word span{color:var(--pink);text-shadow:0 0 16px rgba(255,44,207,.65)}.search{height:48px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 16px;box-shadow:inset 0 0 30px rgba(255,255,255,.03)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}.search input::placeholder{color:#8f8bac}.upload,.admin,.nameBtn,.chip,.icon,.submit,.adminHead button,.adminFields button,.shareBox button,.commentForm button,.namePop button{border:0;border-radius:12px;color:white;background:var(--grad);font-weight:800;box-shadow:0 0 20px rgba(255,44,207,.2);padding:12px 15px;display:inline-flex;align-items:center;gap:8px}.admin,.icon,.chip,.nameBtn{background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none}.nameBtn.warn{color:var(--blue)}.nameBox{position:relative}.namePop{position:absolute;right:0;top:55px;width:270px;background:rgba(16,16,37,.98);border:1px solid var(--line);border-radius:18px;padding:16px;z-index:50;box-shadow:0 22px 60px rgba(0,0,0,.45)}.namePop p{color:var(--muted);font-size:13px}.namePop input,.adminHead input,.modal input,.modal textarea,.adminFields input,.adminFields textarea,.adminFields select,.controls select,.shareBox input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;outline:0}.namePop small,.errText{color:#ff8ba0}.catNav{display:flex;gap:8px;overflow:auto;padding:18px 0 14px}.catNav button{white-space:nowrap;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:999px;padding:10px 13px;text-transform:uppercase;font-weight:900;font-size:13px}.catNav button span{opacity:.75}.catNav button.active{color:white;background:rgba(255,44,207,.12);border-color:var(--line);box-shadow:0 0 22px rgba(255,44,207,.15)}.content{display:grid;grid-template-columns:1fr 320px;gap:20px}.feedHead{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.feedHead h2{font-size:18px;display:flex;align-items:center;gap:8px}.controls{display:flex;gap:8px;align-items:center}.controls select{width:auto}.icon.active{background:var(--grad)}.videoGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.videoList{display:grid;gap:12px}.card{background:rgba(18,18,44,.74);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.25);transition:.18s}.card:hover{transform:translateY(-2px);border-color:rgba(49,201,255,.45)}.card.list{display:grid;grid-template-columns:260px 1fr}.thumb{aspect-ratio:16/9;position:relative;background:#050510;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.play{position:absolute;inset:0;margin:auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.48);backdrop-filter:blur(6px);color:white}.body{padding:14px}.body h3{margin:0 0 8px;font-size:18px;line-height:1.25}.body p{margin:0 0 10px;color:var(--muted);font-size:13px}.body b{color:var(--red)}.stats{display:flex;gap:14px;align-items:center;color:#d7d5ef;font-size:14px}.stats button{background:transparent;border:0;color:inherit;padding:0;display:flex;gap:5px;align-items:center}.stats span{display:flex;gap:5px;align-items:center}.tags,.allTags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tags span,.allTags span{font-size:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.05);padding:5px 8px;border-radius:999px;color:#e9e8ff}.side{background:rgba(18,18,44,.74);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}.side h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}.side button{width:100%;background:transparent;border:0;color:inherit;padding:7px 0;display:flex;justify-content:space-between;align-items:center;text-align:left}.side em{color:var(--muted);font-style:normal}.topRow{gap:10px}.topRow strong{color:var(--blue)}.topRow img{width:74px;height:46px;object-fit:cover;border-radius:9px}.topRow span{font-weight:700;font-size:13px}.topRow small{display:flex;gap:4px;color:var(--muted);margin-top:3px}.promo{background:linear-gradient(145deg,rgba(255,44,207,.18),rgba(49,201,255,.13));border:1px solid var(--line);border-radius:20px;padding:30px 16px;text-align:center}.promo p{font-weight:1000}.promo small{color:var(--muted)}.empty{padding:40px;background:rgba(255,255,255,.04);border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:80;display:grid;place-items:center;padding:20px}.modal{position:relative;background:rgba(13,13,31,.98);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.6);max-height:92vh;overflow:auto}.post{width:min(500px,100%);padding:24px}.post p{color:var(--muted)}.post label{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin:12px 0}.post label input{border:0;background:transparent}.close{position:absolute;top:12px;right:12px;border:0;background:rgba(255,255,255,.08);color:white;border-radius:10px;padding:8px}.submit{justify-content:center;width:100%;margin-top:12px}.error{background:rgba(255,49,78,.12);border:1px solid rgba(255,49,78,.35);padding:12px;border-radius:12px;color:#ffb0bd}.watch{width:min(1120px,100%);display:block;overflow:hidden}.watch .player{width:100%}.player{background:#000;aspect-ratio:16/9}.player iframe{width:100%;height:100%;border:0}.watchInfo{padding:22px}.watchInfo h2{margin-right:35px}.watchInfo p{color:var(--muted)}.shareBox{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin:14px 0}.shareBox input{font-size:13px}.original{display:inline-flex;gap:6px;align-items:center;color:var(--blue);margin:14px 0;text-decoration:none}.commentForm{display:grid;grid-template-columns:1fr auto;gap:8px}.comment{border-top:1px solid var(--line);padding:12px 0}.comment span{color:var(--muted);font-size:12px;margin-left:8px}.comment p{margin:6px 0}.adminWrap{padding-top:24px}.adminHead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.adminHead h2{display:flex;gap:8px;align-items:center;margin-right:auto}.adminHead input{max-width:260px}.adminList{display:grid;gap:12px;margin-top:16px}.adminVideo{display:grid;grid-template-columns:220px 1fr;gap:14px;background:rgba(18,18,44,.74);border:1px solid var(--line);border-radius:18px;padding:12px}.adminThumb{position:relative;aspect-ratio:16/9;background:#050510;border-radius:12px;overflow:hidden;display:grid;place-items:center}.adminThumb img{width:100%;height:100%;object-fit:cover}.adminThumb span{position:absolute;left:8px;top:8px;background:#000a;border-radius:99px;padding:5px 8px}.adminFields{display:grid;gap:8px}.adminFields textarea{min-height:75px}.adminFields div{display:flex;gap:8px;flex-wrap:wrap}.adminFields .danger{background:#ff314e}footer{width:min(1500px,calc(100% - 32px));margin:30px auto 0;padding:24px 0;border-top:1px solid var(--line);display:flex;gap:28px;align-items:center;color:var(--muted)}footer .logo{transform:scale(.65);transform-origin:left center}footer em{margin-left:auto;font-style:normal}@media(max-width:1100px){.content{grid-template-columns:1fr}.sidePanel,aside{display:grid;grid-template-columns:1fr 1fr;gap:14px}.promo{display:none}.videoGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.topInner{grid-template-columns:1fr auto;gap:10px}.brand{grid-column:1}.search{grid-column:1/3;order:3}.upload{font-size:0;padding:12px}.upload svg{margin:0}.nameBox{display:none}.catNav{padding-left:0}.content{display:block}.videoGrid{grid-template-columns:1fr}.card.list{display:block}.sidePanel,aside{display:block}.watch{width:100%}.watchInfo{padding:16px}.shareBox{grid-template-columns:1fr}.commentForm{grid-template-columns:1fr}.adminVideo{grid-template-columns:1fr}footer{flex-wrap:wrap}.word{font-size:30px}.dead{font-size:18px}}@media(max-width:460px){.container,.topInner,footer{width:min(100% - 20px,1500px)}.feedHead{align-items:flex-start;gap:10px;flex-direction:column}.controls{width:100%;overflow:auto}.body h3{font-size:16px}.side{padding:13px}.post{padding:18px}.modal{border-radius:16px}.backdrop{padding:10px}}

.versionBadge{display:block;margin-top:4px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.08em;text-shadow:0 0 12px rgba(49,201,255,.55)}

.watchInfo section{margin-top:18px}.watchInfo{border-top:1px solid var(--line)}

.batchBox{margin:16px 0;background:rgba(18,18,44,.82);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
.batchBox h3{display:flex;gap:8px;align-items:center;margin:0 0 8px}.batchBox p{color:var(--muted);margin:0 0 12px}.batchBox textarea{width:100%;min-height:190px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:12px;outline:0;resize:vertical}.batchGrid{display:grid;grid-template-columns:260px auto;gap:12px;align-items:center;margin-bottom:12px}.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:800}.toggle input{width:auto}.ok{margin-top:12px;background:rgba(49,201,255,.12);border:1px solid rgba(49,201,255,.35);padding:12px;border-radius:12px;color:#dff7ff}.ok ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}.adminFields h3{margin:0}.editBlock{display:grid!important;gap:8px!important;grid-template-columns:1fr 1fr}.editBlock textarea{grid-column:1/-1}.editBlock input:last-child{grid-column:1/-1}.adminFields .soft{background:rgba(255,255,255,.08);border:1px solid var(--line);box-shadow:none}@media(max-width:760px){.batchGrid,.editBlock{grid-template-columns:1fr}.editBlock input:last-child,.editBlock textarea{grid-column:auto}}
</style>
</head>
<body>
<div class="app"><div class="orb a"></div><div class="orb b"></div><div class="gridBg"></div><div id="root"></div></div>
<script>
const API='';
const catsFallback=[{id:'all',label:'Alles',count:0},{id:'painful',label:'Pijnlijk',count:0},{id:'risky',label:'Riskant',count:0},{id:'inventive',label:'Uitvindingen',count:0},{id:'games',label:'Games',count:0},{id:'lifehacks',label:'Lifehacks',count:0},{id:'skills',label:'Vaardigheden',count:0},{id:'hotties',label:'Hotties',count:0},{id:'wtf',label:'WTF',count:0},{id:'fails',label:'Fails',count:0},{id:'random',label:'Willekeurig',count:0}];
let state={videos:[],top:[],cats:catsFallback,category:'all',query:'',sort:'date',order:'desc',layout:'grid',username:localStorage.getItem('kklijp_username')||'',admin:false,active:null,loading:false,status:'pending',adminPassword:localStorage.getItem('kklijp_admin')||'',adminRows:[],batchOpen:false};
const root=document.getElementById('root');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n=0){n=Number(n)||0; if(n>=1e6)return(n/1e6).toFixed(1)+'M'; if(n>=1e3)return(n/1e3).toFixed(1)+'K'; return String(n)}
function ago(iso){let s=Math.max(1,Math.floor((Date.now()-new Date(iso).getTime())/1000)); if(s<60)return s+'s geleden'; let m=Math.floor(s/60); if(m<60)return m+'m geleden'; let h=Math.floor(m/60); if(h<24)return h+'u geleden'; return Math.floor(h/24)+'d geleden'}
async function api(path,opt={}){let r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.error||'API fout');return d}
function logo(){return `<div class="logo"><div class="dead">×_×</div><div class="word"><span>KK</span>LIJP</div></div>`}
async function load(){state.loading=true; render(); try{let qs=new URLSearchParams({q:state.query,category:state.category,sort:state.sort,order:state.order}); let [v,t,c]=await Promise.all([api('/api/videos?'+qs),api('/api/top'),api('/api/categories')]); state.videos=v; state.top=t; state.cats=c; }catch(e){toast(e.message)} state.loading=false; render();}
function toast(msg){alert(msg)}
function render(){root.innerHTML=header()+ (state.admin?adminPanel():mainView()) + footer() + (state.active?videoModal(state.active):''); bind();}
function header(){return `<header class="top"><div class="topInner"><button class="brand" data-home>${logo()}<small class="versionBadge">v1.5.2</small></button><div class="search">🔍<input id="search" value="${esc(state.query)}" placeholder="Zoek video’s, hashtags, categorieën, plaatser..."></div><div class="nameBox"><button class="nameBtn ${state.username?'':'warn'}" data-name>👤 ${esc(state.username||'Naam')}</button></div><button class="upload" data-post>⬆ Video plaatsen</button><button class="admin" data-admin>🛡</button></div></header>`}
function catNav(){return `<nav class="catNav">${state.cats.map(c=>`<button data-cat="${c.id}" class="${state.category===c.id?'active':''}">${esc(c.label)} <span>(${c.count||0})</span></button>`).join('')}</nav>`}
function mainView(){return `<main class="container">${catNav()}<div class="content"><section class="feed"><div class="feedHead"><h2>⚡ ${state.category==='all'?"Nieuwste video's":esc((state.cats.find(c=>c.id===state.category)||{}).label||state.category)+" video's"}</h2><div class="controls"><select id="sort"><option value="date">Datum</option><option value="likes">Likes</option><option value="views">Weergaven</option><option value="name">Titel</option></select><button class="chip" data-order>${state.order==='desc'?'Aflopend':'Oplopend'}</button><button class="icon ${state.layout==='grid'?'active':''}" data-layout="grid">▦</button><button class="icon ${state.layout==='list'?'active':''}" data-layout="list">☰</button></div></div>${state.loading?'<div class="empty">Laden...</div>':(state.videos.length?`<div class="${state.layout==='grid'?'videoGrid':'videoList'}">${state.videos.map(videoCard).join('')}</div>`:'<div class="empty">Geen video\'s gevonden.</div>')}</section><aside>${sidebar()}</aside></div></main>`}
function videoCard(v){let tags=(v.hashtags||[]).slice(0,4).map(t=>`<span>#${esc(t)}</span>`).join('');let extra=Math.max(0,(v.hashtags||[]).length-4);return `<article class="card ${state.layout==='list'?'list':''}" data-open="${v.id}"><div class="thumb">${v.thumbnailUrl?`<img src="${esc(v.thumbnailUrl)}">`:'<div class="noThumb">Geen thumbnail</div>'}<div class="play">▶</div></div><div class="body"><h3>${esc(v.title)}</h3><p><b>${esc(v.postedBy)}</b> · ${ago(v.createdAt)}</p><div class="stats"><button data-like="${v.id}">♡ ${fmt(v.likes)}</button><span>👁 ${fmt(v.views)}</span><span>💬 ${(v.comments||[]).length}</span></div><div class="tags">${tags}${extra>0?`<span>+${extra}</span>`:''}</div></div></article>`}
function sidebar(){return `<div class="side"><h3>🔥 Lijpste video's</h3>${state.top.map((v,i)=>`<button class="topRow" data-open="${v.id}"><strong>${i+1}</strong>${v.thumbnailUrl?`<img src="${esc(v.thumbnailUrl)}">`:''}<span>${esc(v.title)}<small>👁 ${fmt(v.views)} · ♡ ${fmt(v.likes)}</small></span></button>`).join('')||'<p class="empty">Nog geen toplijst.</p>'}</div><div class="promo">${logo()}<p>RAUW. SNEL. LIJP.</p><small>Upload. Kijk. Deel.</small></div>`}
function videoModal(v){let share=location.origin+location.pathname+'?v='+v.id;return `<div class="backdrop" data-backdrop><div class="modal watch"><button class="close" data-close>×</button><div class="player"><iframe src="${esc(v.embedUrl)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="watchInfo"><h2>${esc(v.title)}</h2><p><b>${esc(v.postedBy)}</b> · ${esc((state.cats.find(c=>c.id===v.category)||{}).label||v.category)} · ${ago(v.createdAt)}</p><div class="shareBox"><button data-share="${esc(share)}">Deel</button><input readonly value="${esc(share)}"><button data-copy="${esc(share)}">Kopieer</button></div><div class="tags allTags">${(v.hashtags||[]).map(t=>`<span>#${esc(t)}</span>`).join('')}</div><a class="original" href="${esc(v.url)}" target="_blank" rel="noreferrer">↗ Originele link</a><section><h3>Reacties</h3><form class="commentForm" data-comment="${v.id}"><input name="text" placeholder="${state.username?'Reageer als '+esc(state.username):'Reageer met jouw naam'}"><button>Reageer</button></form>${(v.comments||[]).map(c=>`<div class="comment"><b>${esc(c.name)}</b><span>${ago(c.createdAt)}</span><p>${esc(c.text)}</p></div>`).join('')}</section></div></div></div>`}
function footer(){return `<footer>${logo()}<span>Over</span><span>Regels</span><span>Privacy</span><span>Contact</span><em>© 2026 KKLIJP</em></footer>`}
function adminPanel(){return `<main class="container adminWrap"><div class="adminHead"><h2>🛡 Adminpaneel</h2><input id="adminPass" type="password" value="${esc(state.adminPassword)}" placeholder="Adminwachtwoord"><button data-admin-load>Openen</button><button data-batch>＋ Batch toevoegen</button></div>${state.batchOpen?batchBox():''}<div class="catNav"><button class="${state.status==='pending'?'active':''}" data-status="pending">Wachtend</button><button class="${state.status==='approved'?'active':''}" data-status="approved">Goedgekeurd</button><button class="${state.status==='all'?'active':''}" data-status="all">Alles</button></div><div class="adminList">${state.adminRows.map(adminVideo).join('')}</div></main>`}
function batchBox(){return `<form class="batchBox" data-batch-form><h3>＋ Batch video's toevoegen</h3><p>Maximaal 200 regels. Formaat: <b>link</b> of <b>link | eigen titel</b> of <b>link | eigen titel | naam</b>.</p><div class="batchGrid"><input name="postedBy" value="Admin" placeholder="Standaard naam"><label class="toggle"><input type="checkbox" name="autoApprove" checked> Direct goedkeuren</label></div><textarea name="text" placeholder="https://youtube.com/shorts/... | Titel 1\nhttps://youtu.be/... | Titel 2 | Joris"></textarea><button>Batch toevoegen</button></form>`}
function adminVideo(v){return `<div class="adminVideo"><div class="adminThumb">${v.thumbnailUrl?`<img src="${esc(v.thumbnailUrl)}">`:'▶'}<span>${v.status==='approved'?'Goedgekeurd':'Wachtend'}</span></div><div class="adminFields"><h3>${esc(v.title)}</h3><small>Geplaatst door ${esc(v.postedBy)} · ${esc(v.platform)} · ${esc(v.category)}</small><details><summary class="upload" style="display:inline-flex;margin:8px 0">Bewerken</summary><div class="editBlock"><input name="title" value="${esc(v.title)}"><input name="postedBy" value="${esc(v.postedBy||'')}"><select name="category">${catsFallback.filter(c=>c.id!=='all').map(c=>`<option value="${c.id}" ${c.id===v.category?'selected':''}>${esc(c.label)}</option>`).join('')}</select><textarea name="hashtags">${esc((v.hashtags||[]).join(' '))}</textarea><input name="thumbnailUrl" value="${esc(v.thumbnailUrl||'')}"><input name="url" value="${esc(v.url||'')}"></div></details><div>${v.status!=='approved'?`<button data-approve="${v.id}">✓ Accepteren</button>`:''}<button data-save="${v.id}">Bewerken</button><button class="danger" data-delete="${v.id}">Verwijderen</button></div></div></div>`}
function bind(){document.querySelector('[data-home]')?.addEventListener('click',()=>location.href='/');document.querySelector('[data-admin]')?.addEventListener('click',()=>{state.admin=!state.admin;render();});document.querySelector('[data-post]')?.addEventListener('click',showPost);document.querySelector('[data-name]')?.addEventListener('click',setName);let s=document.getElementById('search');if(s)s.oninput=e=>{state.query=e.target.value;clearTimeout(window.__l);window.__l=setTimeout(load,250)};let so=document.getElementById('sort');if(so){so.value=state.sort;so.onchange=e=>{state.sort=e.target.value;load()}};document.querySelector('[data-order]')?.addEventListener('click',()=>{state.order=state.order==='desc'?'asc':'desc';load()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;load()});document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{state.layout=b.dataset.layout;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=async(e)=>{if(e.target.closest('[data-like]'))return;let id=b.dataset.open;let v=state.videos.concat(state.top,state.adminRows).find(x=>x.id===id);try{v=await api('/api/videos/'+id); await api('/api/videos/'+id+'/view',{method:'POST'}).catch(()=>{}); state.active=v; render(); load();}catch(err){toast(err.message)}});document.querySelectorAll('[data-like]').forEach(b=>b.onclick=like);document.querySelector('[data-close]')?.addEventListener('click',()=>{state.active=null;history.replaceState(null,'',location.pathname);render();});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>navigator.share?navigator.share({title:'KKLIJP',url:b.dataset.share}).catch(()=>{}):navigator.clipboard.writeText(b.dataset.share));document.querySelector('[data-comment]')?.addEventListener('submit',comment);let ap=document.getElementById('adminPass');if(ap)ap.oninput=e=>state.adminPassword=e.target.value;document.querySelector('[data-admin-load]')?.addEventListener('click',loadAdmin);document.querySelector('[data-batch]')?.addEventListener('click',()=>{state.batchOpen=!state.batchOpen;render()});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{state.status=b.dataset.status;loadAdmin()});document.querySelector('[data-batch-form]')?.addEventListener('submit',batchImport);document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>adminAction('/api/admin/videos/'+b.dataset.approve+'/approve',{method:'POST'}));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Verwijderen?'))adminAction('/api/admin/videos/'+b.dataset.delete,{method:'DELETE'})});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveAdmin(b.dataset.save));}
async function setName(){let name=prompt('Jouw naam',state.username||'');if(!name)return;try{let r=await api('/api/session',{method:'POST',body:JSON.stringify({name})});state.username=r.username;localStorage.setItem('kklijp_username',r.username);render()}catch(e){toast(e.message)}}
async function like(e){e.stopPropagation();let id=e.currentTarget.dataset.like;let name=state.username||prompt('Welke naam gebruik je?');if(!name)return;try{let v=await api('/api/videos/'+id+'/like',{method:'POST',body:JSON.stringify({name})});state.username=v.postedBy||name;localStorage.setItem('kklijp_username',name);load()}catch(err){toast(err.message)}}
function showPost(){let box=document.createElement('div');box.className='backdrop';box.innerHTML=`<form class="modal post"><button type="button" class="close">×</button><h2>Video plaatsen</h2><p>Iedereen kan plaatsen. Nieuwe video's komen eerst in de admin-wachtrij.</p><label>👤<input name="name" required value="${esc(state.username)}" placeholder="Jouw naam"></label><label>🔗<input name="url" required placeholder="YouTube / Shorts / Facebook link"></label><label>⚡<input name="title" placeholder="Eigen titel"></label><button class="submit">Zet in wachtrij</button><small>Flood protection actief: max 3 uploads per 10 minuten.</small></form>`;document.body.appendChild(box);box.querySelector('.close').onclick=()=>box.remove();box.querySelector('form').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.currentTarget).entries());try{let v=await api('/api/videos',{method:'POST',body:JSON.stringify(data)});state.username=v.postedBy;localStorage.setItem('kklijp_username',v.postedBy);box.remove();toast('Video staat in de wachtrij.');load()}catch(err){toast(err.message)}}}
async function comment(e){e.preventDefault();let text=new FormData(e.currentTarget).get('text');let name=state.username||prompt('Welke naam gebruik je?');if(!name)return;try{let v=await api('/api/videos/'+e.currentTarget.dataset.comment+'/comments',{method:'POST',body:JSON.stringify({name,text})});state.username=name;localStorage.setItem('kklijp_username',name);state.active=v;render()}catch(err){toast(err.message)}}
async function loadAdmin(){try{localStorage.setItem('kklijp_admin',state.adminPassword);state.adminRows=await api('/api/admin/videos?status='+state.status,{headers:{'x-admin-password':state.adminPassword}});render()}catch(e){toast(e.message)}}
async function adminAction(url,opt){try{await api(url,{...opt,headers:{'x-admin-password':state.adminPassword}});loadAdmin()}catch(e){toast(e.message)}}
async function batchImport(e){e.preventDefault();let f=new FormData(e.currentTarget);let body={text:f.get('text'),postedBy:f.get('postedBy'),status:f.get('autoApprove')?'approved':'pending'};try{let r=await api('/api/admin/videos/batch',{method:'POST',headers:{'x-admin-password':state.adminPassword},body:JSON.stringify(body)});toast('Toegevoegd: '+r.added+' / fouten: '+r.failed);loadAdmin()}catch(err){toast(err.message)}}
async function saveAdmin(id){let card=[...document.querySelectorAll('.adminVideo')].find(x=>x.querySelector(`[data-save="${id}"]`));let body={};card.querySelectorAll('input,textarea,select').forEach(el=>body[el.name]=el.value);try{await api('/api/admin/videos/'+id,{method:'PATCH',headers:{'x-admin-password':state.adminPassword},body:JSON.stringify(body)});loadAdmin()}catch(e){toast(e.message)}}
(async function init(){render(); await load(); let id=new URLSearchParams(location.search).get('v'); if(id){try{state.active=await api('/api/videos/'+id);render()}catch(e){}}})();
</script>
</body>
</html>
